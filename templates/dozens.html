{% raw %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Name the Group</title>
<style>
  :root{ --yellow:#f6d43a; --pink:#ff5da2; --bg:#1a1725; --card:#0e0c16; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:#fff; font-family:-apple-system,
        BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        min-height:100vh; display:flex; align-items:flex-start;
        justify-content:center; padding:22px 16px 60px; }
  .wrap{ width:100%; max-width:560px; }
  h1{ font-weight:900; font-size:44px; letter-spacing:1px; line-height:.95;
      margin:6px 0 2px; color:var(--yellow);
      text-shadow:3px 3px 0 var(--pink); text-transform:uppercase; }
  .tag{ letter-spacing:3px; font-size:13px; color:#b9b3c9; font-weight:700;
        text-transform:uppercase; margin-bottom:18px; }
  .card{ background:var(--card); border:3px solid var(--yellow);
         border-radius:22px; padding:24px 20px; }
  label{ display:block; font-weight:800; font-size:14px; margin:14px 0 6px;
         color:#d8d3e6; letter-spacing:.4px; }
  input[type=text]{ width:100%; padding:14px 14px; font-size:17px;
         border-radius:12px; border:2px solid #3a3550; background:#141020;
         color:#fff; outline:none; }
  input[type=text]:focus{ border-color:var(--yellow); }
  .row{ display:flex; gap:10px; }
  .row .yn{ flex:1; }
  button{ font-family:inherit; cursor:pointer; }
  .yn{ padding:13px; font-size:16px; font-weight:800; border-radius:12px;
       border:2px solid #3a3550; background:#141020; color:#fff; }
  .yn.on{ background:var(--yellow); color:#000; border-color:var(--yellow); }
  .go{ width:100%; margin-top:20px; padding:16px; font-size:20px;
       font-weight:900; border:none; border-radius:14px; background:var(--yellow);
       color:#000; text-transform:uppercase; letter-spacing:1px; }
  .go:disabled{ opacity:.4; }
  .subject{ font-size:34px; font-weight:900; color:var(--yellow);
            text-align:center; margin:6px 0 2px; text-transform:lowercase; }
  .ask{ text-align:center; color:#cfc9dd; font-weight:700; font-size:15px;
        letter-spacing:.5px; margin-bottom:16px; }
  .meta{ display:flex; justify-content:space-between; align-items:center;
         margin-top:16px; font-weight:800; font-size:15px; color:#cfc9dd; }
  .lives{ letter-spacing:2px; font-size:18px; }
  .flash{ min-height:26px; text-align:center; font-weight:800; margin-top:14px;
          font-size:16px; }
  .flash.ok{ color:#5ee08a; }
  .flash.no{ color:var(--pink); }
  .big{ font-size:40px; font-weight:900; color:var(--yellow); text-align:center;
        margin:4px 0; }
  .lead{ text-align:center; color:#e7e3f2; font-size:17px; margin:2px 0 4px; }
  .crown{ text-align:center; margin-top:14px; padding:12px; border-radius:14px;
          background:#141020; border:2px solid #2c2740; font-weight:800; }
  .crown .who{ color:var(--yellow); }
  .played{ text-align:center; color:#8f89a3; font-size:13px; margin-top:18px;
           letter-spacing:.5px; }
  .cta{ display:block; text-align:center; text-decoration:none; margin-top:18px;
        padding:14px; border-radius:12px; background:#e07b2f; color:#fff;
        font-weight:800; font-size:16px; }
  .link{ background:none; border:none; color:#9b95af; text-decoration:underline;
         font-size:14px; margin-top:16px; display:block; width:100%; }
  .foot{ text-align:center; color:#6f6a82; font-size:12px; letter-spacing:2px;
         margin-top:22px; text-transform:uppercase; }
  .hidden{ display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Name<br>the Group</h1>
  <div class="tag">What is a group of ___ called?</div>

  <!-- INTAKE -->
  <div class="card" id="intake">
    <label for="pname">First name</label>
    <input type="text" id="pname" placeholder="e.g. Nate" autocomplete="given-name">

    <label>Need a home cleaning?</label>
    <div class="row">
      <button class="yn" id="ynYes" type="button">Yes</button>
      <button class="yn" id="ynNo"  type="button">No</button>
    </div>

    <div id="contactWrap" class="hidden">
      <label for="pcontact">Where can we reach you? (email or phone)</label>
      <input type="text" id="pcontact" placeholder="you@email.com or (702) 555-0123">
    </div>

    <button class="go" id="startBtn" type="button" disabled>Start the game</button>
    <div class="crown" id="crownIntake"></div>
    <div class="played" id="playedIntake"></div>
  </div>

  <!-- GAME -->
  <div class="card hidden" id="game">
    <div class="ask">What is a group of</div>
    <div class="subject" id="subject">crows</div>
    <div class="ask">called?</div>
    <input type="text" id="answer" placeholder="Type your answer" autocomplete="off">
    <button class="go" id="guessBtn" type="button">Submit</button>
    <div class="flash" id="flash"></div>
    <div class="meta">
      <span>Score: <span id="score">0</span></span>
      <span class="lives" id="lives">&#10084;&#10084;&#10084;</span>
    </div>
  </div>

  <!-- GAME OVER -->
  <div class="card hidden" id="over">
    <div class="lead">Game over</div>
    <div class="big"><span id="finalScore">0</span></div>
    <div class="lead" id="finalLine">groups named</div>
    <div class="crown" id="crownOver"></div>
    <a class="cta" href="/quote">Want the real thing? Get a free quote &rarr;</a>
    <button class="link" id="againBtn" type="button">Play again</button>
    <div class="played" id="playedOver"></div>
  </div>

  <div class="foot">All in good fun &middot; Casey's Cleaning</div>
</div>

<script>
// ---- question bank: subject -> accepted answers (lowercase) --------------

// de-dupe subjects that share display text (keys with digits/underscores are alt slugs)
function displaySubject(s){ return s.replace(/[0-9_].*$/,"").replace(/_/g," "); }

function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t; } return a;
}
function norm(s){
  return (s||"").toLowerCase().trim()
    .replace(/^(a|an|the)\s+/,"")
    .replace(/[.!?,;:'"()]/g,"")
    .replace(/\s+/g," ").trim();
}

var state = { name:"", needs:null, deck:[], idx:0, score:0, misses:0 };

var $ = function(id){ return document.getElementById(id); };

// ---- intake wiring -------------------------------------------------------
function refreshStart(){
  var ok = $("pname").value.trim().length > 0 && state.needs !== null;
  if(state.needs === true) ok = ok && $("pcontact").value.trim().length > 2;
  $("startBtn").disabled = !ok;
}
$("pname").addEventListener("input", refreshStart);
$("pcontact") && $("pcontact").addEventListener("input", refreshStart);
$("ynYes").addEventListener("click", function(){
  state.needs = true; $("ynYes").classList.add("on"); $("ynNo").classList.remove("on");
  $("contactWrap").classList.remove("hidden"); refreshStart();
});
$("ynNo").addEventListener("click", function(){
  state.needs = false; $("ynNo").classList.add("on"); $("ynYes").classList.remove("on");
  $("contactWrap").classList.add("hidden"); refreshStart();
});

function loadTop(){
  fetch("/dozens/top").then(function(r){ return r.json(); }).then(function(d){
    paintTop(d);
  }).catch(function(){});
}
function paintTop(d){
  var txt = (d.top) ? ('&#128081; Top score: <span class="who">' + escapeHtml(d.top.name)
              + '</span> &mdash; ' + d.top.score)
              : '&#128081; No high score yet &mdash; be the first!';
  $("crownIntake").innerHTML = txt;
  $("crownOver").innerHTML = txt;
  var p = (d.played||0);
  var pl = "Games played: " + p;
  $("playedIntake").textContent = pl;
  $("playedOver").textContent = pl;
}
function escapeHtml(s){ var d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }

$("startBtn").addEventListener("click", function(){
  state.name = $("pname").value.trim();
  var contact = state.needs === true ? $("pcontact").value.trim() : "";
  fetch("/dozens/start", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ name: state.name, needs_cleaning: state.needs, contact: contact })
  }).catch(function(){});
  startGame();
});

// ---- game loop -----------------------------------------------------------
function startGame(){
  state.deck = shuffle(BANK.slice()); state.idx = 0; state.score = 0; state.misses = 0;
  $("intake").classList.add("hidden"); $("over").classList.add("hidden");
  $("game").classList.remove("hidden");
  $("score").textContent = "0"; setLives(); nextQ(); $("answer").focus();
}
function setLives(){
  var left = 3 - state.misses; var s = "";
  for(var i=0;i<3;i++){ s += (i<left) ? "\u2764" : "\u2717"; }
  $("lives").innerHTML = s;
}
function nextQ(){
  if(state.idx >= state.deck.length) state.deck = shuffle(BANK.slice()), state.idx = 0;
  var item = state.deck[state.idx];
  $("subject").textContent = displaySubject(item[0]);
  $("answer").value = ""; $("answer").focus();
}
function submitGuess(){
  var item = state.deck[state.idx];
  var accepted = item[1].map(norm);
  var guess = norm($("answer").value);
  if(!guess) return;
  if(accepted.indexOf(guess) !== -1){
    state.score++; $("score").textContent = state.score;
    flash("Correct!", "ok");
  } else {
    state.misses++; setLives();
    flash("Nope \u2014 it's a " + item[1][0], "no");
    if(state.misses >= 3){ setTimeout(endGame, 850); return; }
  }
  state.idx++; setTimeout(nextQ, 650);
}
function flash(msg, cls){
  var f = $("flash"); f.textContent = msg; f.className = "flash " + cls;
  setTimeout(function(){ if(f.textContent===msg){ f.textContent=""; f.className="flash"; } }, 1100);
}
$("guessBtn").addEventListener("click", submitGuess);
$("answer").addEventListener("keydown", function(e){ if(e.key==="Enter") submitGuess(); });

function endGame(){
  $("game").classList.add("hidden"); $("over").classList.remove("hidden");
  $("finalScore").textContent = state.score;
  $("finalLine").textContent = state.score === 1 ? "group named" : "groups named";
  if(state.score > 0){
    fetch("/dozens/score", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ name: state.name, score: state.score })
    }).then(function(r){ return r.json(); }).then(paintTop).catch(loadTop);
  } else { loadTop(); }
}
$("againBtn").addEventListener("click", function(){
  $("over").classList.add("hidden"); $("intake").classList.remove("hidden");
  state.needs = null; $("ynYes").classList.remove("on"); $("ynNo").classList.remove("on");
  $("contactWrap").classList.add("hidden"); $("startBtn").disabled = true; loadTop();
});

loadTop();
</script>
</body>
</html>{% endraw %}
